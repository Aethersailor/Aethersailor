name: 模板错判上报
description: 上报你在模板中发现的 BUG
title: '模板错误'
labels: 'bug'



body:
  - type: checkboxes
    id: verify_steps
    attributes:
      label: Verify Steps
      description: |
        在提交之前，请确认：
      options:
        - label: 我已经在 [Issue Tracker](……/) 中找过我要提出的问题
          required: true
        - label: 我知道本项目提供订阅转换模板，只影响分流。
          required: true
        - label: 我知道本项目订阅转换模板引用的是第三方上游规则，其是否更新与本项目无关。
          required: true
        - label: 我已经更新了最新的 GeoIP、GeoSite 和大陆白名单等数据库。
          required: true
        - label: 我使用的是 OpenWrt/ImmortalWrt 官方发布的固件版本，非第三方编译版本。
          required: true
        - label: 我使用的是最新的 dev 版本 OpenClash。
          required: true
        - label: 这确实是本项目模板的问题
          required: true
        - label: 我有能力协助开发并解决此问题
          required: false
        - label: 我提交的**是无意义的**催促更新或修复请求
          required: false

  - type: dropdown
    id: bug_ini
    attributes:
      label: 存在问题的模板文件
      description: |
        发现问题所在的模板
      multiple: true
      options:
        - Custom_Clash.ini
        - Custom_Clash_Full.ini
        - Custom_Clash_GFW.ini
        - Custom_Clash_Lite.ini
        - Custom_Clash_Mainland.ini
    validations:
      required: true    

